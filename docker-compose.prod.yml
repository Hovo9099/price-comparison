# Production overlay:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Adds HTTPS (Caddy + Let's Encrypt) in front of the backend, serves the admin app, takes daily database backups,
# and stops publishing the database and backend ports on the host (only 80/443 are public).
services:
  postgres:
    ports: !reset []
    restart: unless-stopped

  backend:
    ports: !reset []
    restart: unless-stopped
    environment:
      SERVER_FORWARD_HEADERS_STRATEGY: native
      CORS_ALLOWED_ORIGINS: https://${DOMAIN:?Set DOMAIN in .env}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-240}
      CRAWLER_SCHEDULE_CRON: ${CRAWLER_SCHEDULE_CRON:-0 0 5 * * *}

  caddy:
    build:
      context: .
      dockerfile: deploy/caddy.Dockerfile
    depends_on:
      - backend
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: ["/backup.sh"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-pricecompare}
      PGUSER: ${POSTGRES_USER:-pricecompare}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-1}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups

volumes:
  caddy_data:
  caddy_config:
