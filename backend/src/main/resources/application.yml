server:
  port: ${SERVER_PORT:8080}
  # behind a reverse proxy (deploy/): "native" trusts X-Forwarded-* from private-network proxies only
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  compression:
    enabled: true
    mime-types: application/json

spring:
  application:
    name: where-is-it-cheapest
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pricecompare}
    username: ${DB_USERNAME:pricecompare}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:12}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  admin:
    # Required for /api/admin/** when set. When empty, admin endpoints only accept requests from localhost.
    token: ${ADMIN_TOKEN:}
  push:
    # price-drop notifications via the Expo push service; false = watches work in the app only
    enabled: ${PUSH_ENABLED:true}
    # optional, only when "enhanced push security" is turned on for the Expo project
    expo-access-token: ${EXPO_ACCESS_TOKEN:}
  alerts:
    # crawl failures / shrunken catalogs / stale stores -> Telegram and/or a Slack/Discord-style webhook (both optional)
    telegram-bot-token: ${ALERT_TELEGRAM_BOT_TOKEN:}
    telegram-chat-id: ${ALERT_TELEGRAM_CHAT_ID:}
    webhook-url: ${ALERT_WEBHOOK_URL:}
    stale-hours: ${ALERT_STALE_HOURS:36}
  rate-limit:
    # public API requests per minute per client IP (bursts up to the same number); 0 = off
    per-minute: ${RATE_LIMIT_PER_MINUTE:240}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081,http://localhost:19006}

crawler:
  # 0 = unlimited (full catalog import). Use e.g. 100 for development.
  max-products: ${CRAWLER_MAX_PRODUCTS:0}
  min-delay-ms: ${CRAWLER_MIN_DELAY_MS:700}
  max-retries: 3
  respect-robots-txt: true
  store-raw-snapshots: true
  deactivate-missing: true
  # e.g. "0 0 5 * * *" to crawl every store daily at 05:00; empty disables scheduling
  schedule-cron: ${CRAWLER_SCHEDULE_CRON:}
  providers:
    sas:
      enabled: true
      detail-pages: ${CRAWLER_SAS_DETAIL_PAGES:MISSING}
      fetch-english-names: true
    yerevan-city:
      enabled: true
      detail-pages: ${CRAWLER_YC_DETAIL_PAGES:MISSING}
      fetch-english-names: true
      min-delay-ms: 350
    supermarket-am:
      enabled: true
      fetch-english-names: false
    carrefour:
      enabled: true
      detail-pages: ALL
      fetch-english-names: false
    parma:
      enabled: true
    nor-zovq:
      enabled: true
      # listing pages give prices; product pages (GTIN-13 barcode) only for products never enriched
      detail-pages: ${CRAWLER_ZOVQ_DETAIL_PAGES:MISSING}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    am.pricecompare: INFO
    org.hibernate.SQL: WARN
